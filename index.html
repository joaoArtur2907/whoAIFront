<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Who IA - Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-light d-flex align-items-center justify-content-center vh-100"
  >
    <div class="card shadow p-4" style="width: 400px">
      <div class="text-center mb-4">
        <h3>🤖 Who IA</h3>
        <p class="text-muted">Monitoramento de Reputação</p>
      </div>

      <ul class="nav nav-tabs mb-3" id="authTabs">
        <li class="nav-item">
          <a
            class="nav-link active"
            id="tab-login"
            href="#"
            onclick="toggleAuth('login')"
            >Login</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            id="tab-register"
            href="#"
            onclick="toggleAuth('register')"
            >Criar Conta</a
          >
        </li>
      </ul>

      <form id="authForm">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input type="password" id="password" class="form-control" required />
        </div>

        <div class="mb-3 d-none" id="confirmPasswordGroup">
          <label class="form-label">Confirmar Senha</label>
          <input type="password" id="confirmPassword" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary w-100" id="submitBtn">
          Entrar
        </button>
      </form>
      <div id="alertBox" class="alert alert-danger mt-3 d-none"></div>
    </div>

    <script src="script.js"></script>
    <script>
      // Variável global para controle
      let isLogin = true;

      function toggleAuth(mode) {
        isLogin = mode === "login";

        // Remove active de todos e adiciona no correto pelo ID (resolve o erro 'target undefined')
        document
          .querySelectorAll(".nav-link")
          .forEach((l) => l.classList.remove("active"));

        if (isLogin) {
          document.getElementById("tab-login").classList.add("active");
          document.getElementById("submitBtn").innerText = "Entrar";
          document
            .getElementById("confirmPasswordGroup")
            .classList.add("d-none");
          document.getElementById("confirmPassword").required = false;
        } else {
          document.getElementById("tab-register").classList.add("active");
          document.getElementById("submitBtn").innerText = "Cadastrar";
          document
            .getElementById("confirmPasswordGroup")
            .classList.remove("d-none");
          document.getElementById("confirmPassword").required = true;
        }
      }

      if (localStorage.getItem("who_token"))
        window.location.href = "dashboard.html";
    </script>
  </body>
</html>
