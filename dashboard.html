<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Who IA</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .loader-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.8);
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      /* Estilo para link de ler mais */
      .read-more-link {
        cursor: pointer;
        color: #0d6efd;
        text-decoration: underline;
        font-size: 0.8em;
      }
    </style>
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container">
        <span class="navbar-brand mb-0 h1">🤖 Who IA Dashboard</span>
        <button class="btn btn-outline-light btn-sm" onclick="logout()">
          Sair
        </button>
      </div>
    </nav>

    <div class="container">
      <div id="loadingOverlay" class="loader-overlay d-none">
        <div
          class="spinner-border text-primary"
          role="status"
          style="width: 3rem; height: 3rem"
        ></div>
        <h5 class="mt-3">Analisando dados com IA...</h5>
        <p class="text-muted">Isso pode levar alguns segundos.</p>
      </div>

      <div id="setupSection" class="d-none">
        <div class="card p-5 text-center shadow-sm">
          <h2>Bem-vindo! 👋</h2>
          <p>Para começar, diga qual empresa você quer monitorar.</p>
          <div class="input-group mb-3 mx-auto" style="max-width: 500px">
            <input
              type="text"
              id="companyName"
              class="form-control"
              placeholder="Ex: Nubank, Mercado Livre..."
            />
            <button class="btn btn-primary" onclick="createCompany()">
              Salvar Empresa
            </button>
          </div>
        </div>
      </div>

      <div id="dashboardSection" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 id="companyTitle">Minha Empresa</h4>
          <span
            id="sentimentBadge"
            class="badge ms-3 d-none"
            style="font-size: 0.5em"
          ></span>
          <button
            class="btn btn-success"
            id="btnRefresh"
            onclick="refreshData()"
          >
            🔄 Buscar Novas Reclamações (IA)
          </button>
        </div>

        <div class="row mb-4 text-center">
          <div class="col-md-3">
            <div class="card text-bg-primary h-100">
              <div class="card-body">
                <h5 class="card-title">Total</h5>
                <p class="display-4" id="statTotal">0</p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card text-bg-success h-100">
              <div class="card-body">
                <h5 class="card-title">Positivos</h5>
                <p class="display-4" id="statPositive">0</p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card text-bg-danger h-100">
              <div class="card-body">
                <h5 class="card-title">Negativos</h5>
                <p class="display-4" id="statNegative">0</p>
              </div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="card text-bg-secondary h-100">
              <div class="card-body">
                <h5 class="card-title">Neutros</h5>
                <p class="display-4" id="statNeutral">0</p>
              </div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-4">
            <div class="card shadow-sm mb-4">
              <div class="card-header">🔥 Tópicos Recorrentes</div>
              <ul class="list-group list-group-flush" id="topicsList"></ul>
            </div>
          </div>

          <div class="col-md-8">
            <div class="card shadow-sm">
              <div class="card-header">📢 Últimas Reclamações</div>
              <div class="card-body" id="feedList"></div>

              <div
                class="card-footer d-flex justify-content-between align-items-center"
              >
                <button
                  id="btnPrev"
                  class="btn btn-sm btn-outline-secondary"
                  onclick="changePage(-1)"
                  disabled
                >
                  Anterior
                </button>
                <span class="small text-muted" id="pageInfo">Página 1</span>
                <button
                  id="btnNext"
                  class="btn btn-sm btn-outline-secondary"
                  onclick="changePage(1)"
                  disabled
                >
                  Próximo
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      checkAuth();
    </script>
  </body>
</html>
